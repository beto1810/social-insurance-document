[project]
name = "ai-document-understanding"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate>=1.14.0",
    "datasets>=5.0.1",
    "evaluate>=0.4.6",
    "matplotlib>=3.11.1",
    "paddleocr>=3.7.0",
    "paddlex[ocr]>=3.7.0,<3.8.0",
    "paddlepaddle>=2.7.0",
    "pandas>=3.0.5",
    "pillow>=10.2.0",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "tqdm>=4.70.0",
    "transformers>=5.14.1",
    "setuptools<82",
    "dataset>=2.0.0",
    "jiwer>=4.0.0",
    "logger>=1.4",
    "vncv>=0.1.8",
    "pymupdf>=1.28.2",
    "numpy>=2.3.5",
    "prefetch-generator>=1.0.3",
    "streamlit>=1.62.0",
    "openpyxl>=3.1.5",
    "huggingface-hub>=1.26.0",
    "vietocr>=0.1.5",
    "detectron2 @ git+https://github.com/facebookresearch/detectron2.git"
]

[tool.uv.sources]
vietocr = { path = "third_party/vietocr", editable = true }

[tool.uv]

no-build-isolation-package = ["detectron2"]

override-dependencies = [
    "opencv-python==4.10.0.84",
    "opencv-python-headless==4.10.0.84",
    "opencv-contrib-python==4.10.0.84",
]
